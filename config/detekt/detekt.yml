build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']
  LargeClass:
    threshold: 600
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInObjects: 20
    ignoreAnnotated: ['Dao', 'Module']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
